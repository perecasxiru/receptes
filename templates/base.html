<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Receptes{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #faf6f0;
            --ink: #2b2520;
            --muted: #7a6e64;
            --line: #ece3d7;
            --accent: #c4572e;
            --accent-dark: #a2441f;
            --accent-soft: #f6e3d9;
            --bs-body-bg: var(--paper);
            --bs-body-color: var(--ink);
            --bs-body-font-family: 'Inter', system-ui, sans-serif;
            --bs-link-color-rgb: 196, 87, 46;
            --bs-link-hover-color-rgb: 162, 68, 31;
        }
        h1, h2, h3, .navbar-brand, .serif {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .site-nav {
            background: rgba(250, 246, 240, 0.92);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--line);
        }
        .site-nav .navbar-brand { color: var(--ink); font-size: 1.5rem; }
        .site-nav .navbar-brand span { color: var(--accent); }
        .site-nav .nav-link { color: var(--muted); font-weight: 500; }
        .site-nav .nav-link:hover { color: var(--accent); }

        .btn-accent {
            --bs-btn-color: #fff;
            --bs-btn-bg: var(--accent);
            --bs-btn-border-color: var(--accent);
            --bs-btn-hover-color: #fff;
            --bs-btn-hover-bg: var(--accent-dark);
            --bs-btn-hover-border-color: var(--accent-dark);
            --bs-btn-active-bg: var(--accent-dark);
            --bs-btn-active-border-color: var(--accent-dark);
        }
        .btn-soft {
            --bs-btn-color: var(--accent-dark);
            --bs-btn-bg: var(--accent-soft);
            --bs-btn-border-color: var(--accent-soft);
            --bs-btn-hover-color: #fff;
            --bs-btn-hover-bg: var(--accent);
            --bs-btn-hover-border-color: var(--accent);
        }
        .form-control:focus, .form-check-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 .2rem rgba(196, 87, 46, .2);
        }
        .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }

        /* Tag chips */
        .chip {
            display: inline-block;
            padding: .3rem .85rem;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            font-size: .875rem;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
            transition: background .15s, color .15s, border-color .15s;
        }
        a.chip:hover { border-color: var(--accent); color: var(--accent); }
        .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .chip-sm { padding: .1rem .55rem; font-size: .75rem; background: var(--accent-soft); border-color: transparent; color: var(--accent-dark); }

        .pagination {
            --bs-pagination-color: var(--ink);
            --bs-pagination-hover-color: var(--accent);
            --bs-pagination-active-bg: var(--accent);
            --bs-pagination-active-border-color: var(--accent);
            --bs-pagination-focus-box-shadow: 0 0 0 .2rem rgba(196, 87, 46, .2);
        }
        .site-footer { color: var(--muted); border-top: 1px solid var(--line); }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-md site-nav sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'recipe_list' %}">Receptes<span>.</span></a>
            {% if user.is_staff %}
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Obrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav align-items-md-center gap-md-2">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-accent btn-sm px-3" href="{% url 'recipe_create' %}">+ Nova recepta</a>
                        </li>
                    </ul>
                </div>
            {% endif %}
        </div>
    </nav>

    <main class="container py-4 py-md-5 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer py-4 mt-4">
        <div class="container small">Receptes de casa</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
